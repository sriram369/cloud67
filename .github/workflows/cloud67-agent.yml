name: Cloud67 OpenHands runner
on:
  push:
    paths: ['cloud/**', '.github/workflows/cloud67-agent.yml']
  pull_request:
    paths: ['cloud/**', '.github/workflows/cloud67-agent.yml']
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions: {}
concurrency:
  group: cloud67-coding-runner
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate runner and free-routing tests
        run: |
          node --test cloud/test/*.test.mjs
          python3 -m unittest discover -s cloud/test -p 'test_*.py' -v
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify actual OpenHands SDK and conversation persistence
        run: |
          pip install --quiet openhands-sdk==1.55.1 openhands-tools==1.55.1 litellm==1.93.0
          python cloud/test/sdk_smoke.py
  run-task:
    needs: verify
    if: github.repository == 'sriram369/cloud67' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run one OpenHands conversation turn
        env:
          CLOUD67_URL: ${{ vars.CLOUD67_URL }}
          CLOUD67_RUNNER_TOKEN: ${{ secrets.CLOUD67_RUNNER_TOKEN }}
          CLOUD67_BASE_BRANCH: dev
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud/runner.py
